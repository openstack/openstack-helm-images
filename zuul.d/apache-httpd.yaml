- job:
    name: openstack-helm-images-build-apache-httpd
    parent: openstack-helm-images-build
    description: Build apache-httpd images
    nodeset: openstack-helm-images-ubuntu-noble
    vars: &apache_httpd_vars
      currentdate: "{{ now(utc=True,fmt='%Y%m%d') }}"
      container_images:
        - context: apache-httpd
          registry: quay.io
          repository: quay.io/airshipit/apache-httpd
          container_filename: Dockerfile.ubuntu
          arch:
            - linux/amd64
          tags:
            - latest-ubuntu_noble
            - "ubuntu_noble-{{ currentdate }}"
          build_args:
            - FROM=quay.io/airshipit/ubuntu:noble
        - context: apache-httpd
          registry: quay.io
          repository: quay.io/airshipit/apache-httpd
          container_filename: Dockerfile.ubuntu
          arch:
            - linux/amd64
          tags:
            - latest-ubuntu_resolute
            - "ubuntu_resolute-{{ currentdate }}"
          build_args:
            # There is no resolute image in quay.io/airshipit/ubuntu, so pull
            # Ubuntu upstream like the base image does.
            - FROM=public.ecr.aws/ubuntu/ubuntu:resolute
    files: &apache_httpd_files
      - apache-httpd/.*
      - zuul.d/apache-httpd.yaml
      - roles/.*
      - playbooks/.*

- job:
    name: openstack-helm-images-upload-apache-httpd
    parent: openstack-helm-images-upload
    description: Build and upload apache-httpd images
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-apache-httpd
    vars: *apache_httpd_vars
    files: *apache_httpd_files

- job:
    name: openstack-helm-images-promote-apache-httpd
    parent: openstack-helm-images-promote
    description: Promote a previously published apache-httpd image to latest.
    vars: *apache_httpd_vars
    files: *apache_httpd_files
