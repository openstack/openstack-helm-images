- name: Tag image for buildset registry
  command: >-
    {{ container_command }} tag {{ zj_image.repository }}:{{ zj_image_tag }} {{ buildset_registry_alias }}:{{ buildset_registry.port }}/{{ zj_image.repository }}:{{ zj_image_tag }}
  register: result
  until: result is succeeded
  retries: 3
  loop: "{{ zj_image.tags | default(['latest']) }}"
  loop_control:
    loop_var: zj_image_tag

# A stall in a registry operation never returns, so the retry below is never
# evaluated. Cap it so a stall exits 124 and the retry actually happens.
- name: Push tag to buildset registry
  command: >-
    timeout {{ container_image_push_timeout }} {{ container_command }} push {{ buildset_registry_alias }}:{{ buildset_registry.port }}/{{ zj_image.repository }}:{{ zj_image_tag }}
  register: result
  until: result is succeeded
  retries: 3
  loop: "{{ zj_image.tags | default(['latest']) }}"
  loop_control:
    loop_var: zj_image_tag
